name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  build-publish:
    name: Build and publish image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    name: Deploy and smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start API with Docker Compose
        env:
          API_IMAGE: ${{ needs.build-publish.outputs.image }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$API_IMAGE"
          API_IMAGE="$API_IMAGE" docker compose up -d --no-build api

      - name: Wait for API health
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > health.json; then
              python -c 'import json; payload=json.load(open("health.json")); assert payload.get("status") == "ok" and payload.get("model_ready") is True, payload'
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1

      - name: Create smoke-test image
        run: |
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 --decode > smoke-test.png

      - name: Smoke-test prediction endpoint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -F "file=@smoke-test.png;type=image/png" \
            http://localhost:8000/predict > prediction.json
          python -c 'import json; payload=json.load(open("prediction.json")); assert isinstance(payload.get("class"), str) and isinstance(payload.get("confidence"), (int, float)) and 0 <= payload["confidence"] <= 1, payload'

      - name: Stop API
        if: always()
        run: docker compose down
