apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      # --- ADDED: Init Container to fix hostPath permissions ---
      initContainers:
      - name: fix-permissions
        image: busybox:latest
        command: ["sh", "-c", "chown -R 472:472 /var/lib/grafana"]
        securityContext:
          runAsUser: 0  # Runs as root purely to adjust folder ownership
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage-volume
      # --------------------------------------------------------
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage-volume
      volumes:
      - name: grafana-storage-volume
        hostPath:
          path: /tmp/grafana-local-storage
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: grafana