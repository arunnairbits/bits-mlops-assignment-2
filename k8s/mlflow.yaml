apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      # containers:
      # - name: mlflow
      #   image: ghcr.io/mlflow/mlflow:latest
      #   command: 
      #   - "mlflow"
      #   - "server"
      #   - "--backend-store-uri"
      #   - "sqlite:////mlflow/mlruns/mlflow.db"
      #   - "--default-artifact-root"
      #   - "/mlflow/mlruns"
      #   - "--host"
      #   - "0.0.0.0"
      #   - "--port"
      #   - "5000"
      #   ports:
      #   - containerPort: 5000
      #   volumeMounts:
      #   - name: mlflow-data
      #     mountPath: /mlflow/mlruns
      containers:
      - name: mlflow
        # image: ghcr.io/mlflow/mlflow:v2.14.1
        image: ghcr.io/mlflow/mlflow:latest
        # command: ["mlflow", "server", "--backend-store-uri", "/mlflow/mlruns", "--host", "0.0.0.0", "--port", "5000"]
        command: ["mlflow", "server", "--backend-store-uri", "sqlite:////mlflow/mlruns/mlflow.db", "--host", "0.0.0.0", "--port", "5000", "--serve-artifacts"]
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow/mlruns
      volumes:
      - name: mlflow-data
        hostPath:
          # CHANGE THIS PATH to the absolute path of the mlruns folder on your laptop
          path: /Users/arunnair/Documents/bits-mlops-assignment-1/mlruns
          # type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  type: LoadBalancer
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: mlflow